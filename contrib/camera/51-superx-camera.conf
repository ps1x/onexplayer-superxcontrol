# Prefer the physical libcamera node for the OneXPlayer Super X colour camera.
# libcamera carries the ACPI mounting rotation; the duplicate raw V4L2 node
# cannot expose that metadata to PipeWire clients.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "~v4l2_device\\.pci-0000_c4_00\\.4-usb-0_1_1\\.0.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

[general]
# "toggle" alternates the two named states below. "command" only runs the
# command in this section.
behavior = toggle
command =

# Preserve the vendor firmware TDP and Turbo-LED action before the configured
# action runs. Set this to false to make the button completely software-owned.
firmware_action = true

# State names are user-defined. Exactly two are required for toggle behavior.
states = power-saving, performance
initial_state = power-saving

[state power-saving]
power_profile = power-saver
# STAPM, fast, and slow limits in watts, or "unchanged".
tdp = 10, 15, 10
# One of the /usr/local/bin/oxp-rgb presets, or "unchanged".
led = unchanged
# Optional root command run after this state has been applied.
command =

[state performance]
power_profile = performance
tdp = 80, 80, 80
led = unchanged
command =
